name: CI

# PRECONDITION, not a follow-up (pack review, 2026-08-29).
# Six servers would depend on this package. Shipping a hand-tested chassis through a pipeline
# that does not test is this project's own failure family one layer up: a declaration of
# quality that never executes. So the tests RUN here, and a green bar means they ran.
#
# 2026-08-31: the Python kit moved to kits/python/ in the monorepo restructure (spec/ and
# conformance/ stay at the repo root, shared by every language kit). Jobs run from the kit
# directory; the corpus tests read the root conformance/ via a relative path in the checkout.
# The vendored-form job was removed: the v2-only cutover retired the single-file vendoring
# model (mcpkit.vendor no longer exists), so the job tested a feature that is gone.

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: kits/python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # conftest.py fails the run on an unexplained skip; --strict-markers/--strict-config and
      # warnings-as-errors come from pyproject. A green bar here means the tests RAN.
      - run: pytest -q

  typescript:
    # The TypeScript kit passes the SAME root conformance/ corpus as Python — so it is tested
    # here too, or "same guarantee in every language" is a claim that never executes. Overrides
    # the workflow-level working-directory (which points at kits/python).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  dependency-rule:
    # STUBBY, 2026-08-29: after publishing, this package becomes a write path into six servers,
    # one of which ACTS on its input. The runtime dependency set is therefore ENFORCED, not
    # assumed -- every added dependency widens that path. The permitted set is mcp (the SDK)
    # and starlette (the ASGI seam behind make_bearer_asgi); anything else fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: runtime dependencies must be within the permitted set
        run: |
          python - <<'PY'
          import tomllib, sys
          deps = tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]
          names = sorted(d.split(">")[0].split("=")[0].split("[")[0].split("<")[0].strip() for d in deps)
          permitted = ["mcp", "starlette"]
          extra = [n for n in names if n not in permitted]
          if extra:
              print(f"FAIL: runtime dependencies {extra} are outside the permitted set {permitted}.")
              print("Every added dependency widens the supply-chain path into six servers.")
              sys.exit(1)
          print(f"OK: runtime dependencies = {names} (within {permitted})")
          PY

  php:
    # The PHP kit passes the SAME root conformance/ corpus. ext-intl enables the NFKC-confusable
    # message test (skipped without it).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits/php
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
