# Split-mirror config for the PHP kit — sourced by scripts/split-mirror.sh.
# Declares how kits/php/ is assembled into its standalone Packagist mirror repo.
# Adding a mirror for a future kit = drop a .mirror.conf next to that kit; no code change.

# The read-only mirror repo (org/name). Its ROOT is this package.
MIRROR_REPO="srclight/ironmcp-php"

# Monorepo-root dirs vendored INTO the mirror so its tests run standalone.
VENDOR_DIRS="conformance spec"

# Monorepo-root files copied to the mirror root.
ROOT_FILES="LICENSE"

# Mirror-specific README (relative to this kit dir); becomes README.md in the mirror.
# The kit's own README.md is NOT shipped — it has monorepo-relative links.
MIRROR_README="README.mirror.md"

# Monorepo tag prefix for this kit; stripped to form the mirror's plain-semver tag
# (monorepo php-0.1.0  ->  mirror 0.1.0, which is the Composer/Packagist version).
TAG_PREFIX="php-"

# Optional: Packagist package to ping after a push (only used if PACKAGIST_TOKEN is set).
PACKAGIST_PACKAGE="ironmcp/core"
